<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Percentage-Fraction Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./percent_fraction_icon.png" />
  <style>
    :root {
      --bg-gradient: linear-gradient(to right, #e0f7fa, #fff3e0);
      --card-bg: #ffffffcc;
      --text-color: #222;
      --primary-gradient: linear-gradient(135deg, #42a5f5, #478ed1);
      --accent-gradient: linear-gradient(135deg, #66bb6a, #43a047);
      --footer-bg: rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: var(--bg-gradient);
      color: var(--text-color);
      padding: 2rem;
      transition: background 0.5s, color 0.5s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark {
      --bg-gradient: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      --card-bg: #37474fcc;
      --text-color: #ffffff;
      --footer-bg: linear-gradient(to right, #37474f, #263238);
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
      animation: fadeSlideDown 1s ease;
    }

    .main-title {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: bold;
      background: linear-gradient(90deg, #2196f3, #9c27b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #666;
      animation: fadeIn 2s ease;
    }

    body.dark .tagline {
      color: #bbb;
    }

    #top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2rem;
      animation: fadeInDown 1s ease;
    }

    button, select, label {
      padding: 0.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-image: var(--primary-gradient);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover, select:hover {
      transform: scale(1.05);
      background-image: var(--accent-gradient);
    }

    select {
      appearance: none;
      background-image: var(--primary-gradient);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    select option {
      color: #000;
      background-color: #fff;
    }

    body.dark select option {
      color: #fff;
      background-color: #424242;
    }

    .section {
      max-width: 600px;
      margin: auto;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1.2rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      animation: fadeInUp 1s ease;
      backdrop-filter: blur(8px);
    }

    .question {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
    }

    .options {
      display: grid;
      gap: 0.8rem;
    }

    .option-btn {
      font-size: 1.1rem;
      padding: 0.8rem;
      border-radius: 0.8rem;
      border: 2px solid transparent;
      background: var(--primary-gradient);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .option-btn:hover { transform: scale(1.05); }

    .correct { background: #4caf50 !important; color: #fff; }
    .incorrect { background: #e53935 !important; color: #fff; }

    progress {
      width: 100%;
      height: 15px;
      border-radius: 10px;
      overflow: hidden;
      background-color: #e0e0e0;
      margin-bottom: 10px;
    }

    progress::-webkit-progress-value {
      background-image: linear-gradient(90deg, #00c6ff, #0072ff);
    }

    .timer {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .summary {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #fce4ec;
      border-radius: 1rem;
      text-align: center;
      font-size: 1.1rem;
      animation: fadeInUp 1s ease;
      color: #000;
      display: none;
    }
    summary:hover{
        cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 1rem 0;
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="main-title">📊 Percentage–Fraction Practice 📊</h1>
    <p class="tagline">Convert percentages into fractions – fast and fun!</p>
  </div>

  <div id="top-controls">
    <button id="start-button">Start</button>
    <button id="stop-button">Stop</button>
    <label><input type="checkbox" id="theme-toggle"> Dark Mode</label>
    <label><input type="checkbox" id="sound-toggle" checked> Sound</label>
    <label><input type="checkbox" id="fullscreen-toggle" onclick="toggleFullscreen()"> Fullscreen</label>
    <select id="difficulty-select">
        <option value="basic">Basic (Sequential)</option>
        <option value="intermediate">Intermediate (Sequential)</option>
        <option value="all">All (Sequential)</option>
        <option value="rand-basic">🎲 Random Basic</option>
        <option value="rand-intermediate">🎲 Random Intermediate</option>
        <option value="rand-all" selected>🎲 Random All</option>
    </select>
  </div>

  <div class="timer" id="timer-display">Time: 00:00</div>

  <div class="section" id="quiz-section">
    <progress id="progress-bar" value="0" max="10"></progress>
    <div class="question" id="question">Press Start to begin</div>
    <div class="options" id="options"></div>
    <div class="score" id="score">Score: 0</div>
  </div>

  <div class="summary" id="summary"></div>

  <footer>
    &copy; 2025 Percentage-Fraction Practice | Made for educational purposes.<br>
    <p>ramit-kumar-edition</p>
  </footer>

  <audio id="correct-sound" src="./correct-choice.mp3"></audio>
  <audio id="incorrect-sound" src="./wrong-answer.wav"></audio>

  <script>
    // =================== QUESTION BANK ===================
    const basicSet = [
    { percent: 4, fraction: "1/25" },
    { percent: 5, fraction: "1/20" },
    { percent: 6.25, fraction: "1/16" },
    { percent: "6(2/3)", fraction: "1/15" },
    { percent: "7(1/7)", fraction: "1/14" },
    { percent: "8(1/3)", fraction: "1/12" },
    { percent: 9.09, fraction: "1/11" },
    { percent: "11(1/9)", fraction: "1/9" },
    { percent: 12.5, fraction: "1/8" },
    { percent: "14(2/7)", fraction: "1/7" },
    { percent: "16(2/3)", fraction: "1/6" },
    { percent: 20, fraction: "1/5" },
    { percent: 25, fraction: "1/4" },
    { percent: "33(1/3)", fraction: "1/3" },
    { percent: 37.5, fraction: "3/8" },
    { percent: 40, fraction: "2/5" },
    { percent: 50, fraction: "1/2" },
    { percent: 60, fraction: "3/5" },
    { percent: 66.6, fraction: "2/3" },
    { percent: 75, fraction: "3/4" },
    { percent: 80, fraction: "4/5" },
    { percent: 100, fraction: "1/1" }
    ];

    const intermediateSet = [
    { percent: "22(2/9)", fraction: "2/9" },
    { percent: "24", fraction: "6/25" },
    { percent: "28(4/7)", fraction: "2/7" },
    { percent: "27.27", fraction: "3/11" },
    { percent: "35", fraction: "7/20" },
    { percent: "36.36", fraction: "4/11" },
    { percent: "42(6/7)", fraction: "3/7" },
    { percent: "44(4/9)", fraction: "4/9" },
    { percent: "45.45", fraction: "5/11" },
    { percent: "55(5/9)", fraction: "5/9" },
    { percent: "55", fraction: "11/20" },
    { percent: "57(1/7)", fraction: "4/7" },
    { percent: "62.5", fraction: "5/8" },
    { percent: "71(3/7)", fraction: "5/7" },
    { percent: "83(1/3)", fraction: "5/6" },
    { percent: "120", fraction: "6/5" },
    { percent: "125", fraction: "5/4" },
    { percent: "150", fraction: "3/2" },
    { percent: "5(15/17)", fraction: "1/17" },
    { percent: "5(5/9)", fraction: "1/18" },
    { percent: "5(5/19)", fraction: "1/19" },
    { percent: "18.18", fraction: "2/11" },
    { percent: "15", fraction: "3/20" },
    { percent: "8", fraction: "2/25" },
    { percent: "12", fraction: "3/25" },
    { percent: "16", fraction: "4/25" }
    ];

    const allSet = [...basicSet, ...intermediateSet];

    // =================== MODE SETUP ===================
    let data = [];
    function setModeQuestions(mode) {
        switch (mode) {
            case "basic": data = [...basicSet]; break;
            case "intermediate": data = [...intermediateSet]; break;
            case "all": data = [...allSet]; break;
            case "rand-basic": data = shuffle([...basicSet]); break;
            case "rand-intermediate": data = shuffle([...intermediateSet]); break;
            case "rand-all": data = shuffle([...allSet]); break;
        }
    }


    let currentIndex = 0, score = 0, total = 0;
    let timer = 0, timerInterval;
    let randomMode = true;
    let incorrect = [];

    const qElem = document.getElementById("question");
    const optsElem = document.getElementById("options");
    const scoreElem = document.getElementById("score");
    const summaryElem = document.getElementById("summary");
    const timerElem = document.getElementById("timer-display");
    const correctSound = document.getElementById("correct-sound");
    const wrongSound = document.getElementById("incorrect-sound");
    const progressBar = document.getElementById("progress-bar");

    function formatTime(t) {
      const m = String(Math.floor(t/60)).padStart(2,'0');
      const s = String(t%60).padStart(2,'0');
      return `${m}:${s}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timer = 0;
      timerInterval = setInterval(()=>{
        timer++;
        timerElem.textContent = `Time: ${formatTime(timer)}`;
      },1000);
    }

    function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

    function startGame() {
        summaryElem.style.display = "none";
        score = total = currentIndex = 0;
        incorrect = [];
        progressBar.value = 0;
        scoreElem.textContent = "Score: 0";
        mode = document.getElementById("difficulty-select").value;
        startTimer();
        setModeQuestions(mode);
        nextQuestion();
    }

    function nextQuestion(){
      optsElem.innerHTML = "";
      if(currentIndex >= data.length){
        endGame();
        return;
      }

      const q = data[currentIndex];
      const correct = q.fraction;
      const options = [correct];
      while(options.length < 4){
        const r = data[Math.floor(Math.random()*data.length)].fraction;
        if(!options.includes(r)) options.push(r);
      }
      shuffle(options);

      qElem.textContent = `What is the fraction value of ${q.percent}% ?`;

      options.forEach(opt=>{
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = ()=>handleAnswer(btn,opt,correct,q);
        optsElem.appendChild(btn);
      });
      progressBar.value = ++total;
    }

    function handleAnswer(btn,selected,correct,q){
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b=>b.disabled=true);
      if(selected===correct){
        btn.classList.add("correct");
        score++;
        if(document.getElementById("sound-toggle").checked) correctSound.play();
      }else{
        btn.classList.add("incorrect");
        if(document.getElementById("sound-toggle").checked) wrongSound.play();
        incorrect.push({question:`${q.percent}%`,correct,selected});
        buttons.forEach(b=>{if(b.textContent===correct)b.classList.add("correct");});
      }
      scoreElem.textContent = `Score: ${score}`;
      currentIndex++;
      setTimeout(nextQuestion,1200);
    }

    function endGame(){
      clearInterval(timerInterval);
      qElem.textContent = "🎉 Finished!";
      optsElem.innerHTML = "";
      summaryElem.style.display = "block";
      const acc = Math.round((score/total)*100);
      const mistakeList = incorrect.map(i=>`<li>${i.question} → Correct: <strong>${i.correct}</strong> (You chose: ${i.selected})</li>`).join('');
      summaryElem.innerHTML = `
        <h2>Game Summary</h2>
        <p><span style="color: green;">✔ Correct:</span> ${score} <span style="color: red;">❌ Incorrect:</span> ${total - score}<br>Accuracy: ${acc}%</p>
        ${mistakeList ? `<details><summary style="color: gray;">Show Incorrect Answers</summary><ul>${mistakeList}</ul></details>` : ''}
        <p>Time Taken: ${formatTime(timer)}</p>
      `;
    }

    document.getElementById("start-button").onclick = startGame;
    document.getElementById("stop-button").onclick = ()=>{
      clearInterval(timerInterval);
      qElem.textContent = "Game stopped.";
      optsElem.innerHTML = "";
    };
    document.getElementById("theme-toggle").onchange = (e)=>{
      document.body.classList.toggle("dark", e.target.checked);
    };

    function toggleFullscreen(){
      if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen(); }
    }

    // 🔥 Keyboard Shortcuts
    document.addEventListener("keydown",e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
      switch(e.key.toLowerCase()){
        case "s": document.getElementById("start-button").click(); break;
        case "a":
        case "q": document.getElementById("stop-button").click(); break;
        case "d":
            const dark=document.getElementById("theme-toggle");
            dark.checked=!dark.checked; dark.dispatchEvent(new Event("change"));
            break;
        case "m":
            const snd=document.getElementById("sound-toggle");
            snd.checked=!snd.checked; break;
        case "f": toggleFullscreen(); break;
        case "l":
            const modeSel = document.getElementById("difficulty-select");
            const opts = Array.from(modeSel.options);
            const currentIndex = opts.findIndex(o => o.value === modeSel.value);
            const nextIndex = (currentIndex + 1) % opts.length;
            modeSel.value = opts[nextIndex].value;
            // Optional: visually confirm mode change (for user feedback)
            qElem.textContent = `🔄 Mode changed to: ${modeSel.options[nextIndex].text}`;
            break;
      }
    });
  </script>
</body>
</html>
